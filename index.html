<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Color Orders</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="apple-touch-icon" href="https://drive.google.com/uc?export=view&id=1-aFVORAgJiT7a_rDzY4Eo9jwXgqqSzi6"/>
<link rel="icon" type="image/png" href="https://drive.google.com/uc?export=view&id=1-aFVORAgJiT7a_rDzY4Eo9jwXgqqSzi6"/>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{background:#f5f5f5;min-height:100vh;font-family:'Heebo',sans-serif;direction:rtl;color:#1a1a1a;}
input,textarea,select,button{font-family:'Heebo',sans-serif;}
::-webkit-scrollbar{width:4px;}::-webkit-scrollbar-thumb{background:#ccc;border-radius:2px;}
a{color:#a78bfa;}

.screen{padding:20px;max-width:560px;margin:0 auto;padding-bottom:48px;}
.label{font-size:11px;font-weight:600;color:#666;letter-spacing:1px;text-transform:uppercase;margin-bottom:6px;}
.field{margin-bottom:16px;}

.input{width:100%;background:#ffffff;border:1px solid #ccc;border-radius:8px;padding:10px 12px;color:#1a1a1a;font-size:15px;outline:none;}
.input:focus{border-color:#a78bfa;}
textarea.input{resize:vertical;}

.card{background:#ffffff;box-shadow:0 1px 4px rgba(0,0,0,0.08);border-radius:12px;padding:18px;border:1px solid #e0e0e0;margin-bottom:14px;}
.card-title{font-size:14px;font-weight:600;margin-bottom:14px;}

.btn{padding:11px 22px;border-radius:10px;border:none;font-family:'Heebo';font-size:15px;font-weight:700;cursor:pointer;}
.btn:disabled{opacity:.4;cursor:not-allowed;}
.btn-full{width:100%;}
.btn-flex{flex:1;}

.toggle-group{display:flex;gap:8px;flex-wrap:wrap;}
.toggle-btn{padding:8px 18px;border-radius:8px;border:1px solid #ccc;background:transparent;color:#666;cursor:pointer;font-family:'Heebo';font-size:14px;}
.toggle-btn.active{font-weight:700;}

.multi-group{display:flex;flex-wrap:wrap;gap:8px;}
.multi-btn{padding:6px 13px;border-radius:6px;border:1px solid #ccc;background:transparent;color:#666;cursor:pointer;font-family:'Heebo';font-size:13px;}
.multi-btn.active{border-color:#a78bfa;background:rgba(167,139,250,0.15);color:#a78bfa;font-weight:700;}

.badge{border-radius:6px;padding:3px 10px;font-size:12px;font-weight:600;}

.nav-btn{width:100%;padding:18px 20px;border-radius:12px;border:none;cursor:pointer;display:flex;align-items:center;gap:14px;text-align:right;font-family:'Heebo';margin-bottom:12px;}
.nav-icon{width:42px;height:42px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0;}
.nav-badge{border-radius:50%;width:26px;height:26px;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;flex-shrink:0;color:#000;}

.order-row{cursor:pointer;}
.order-meta{font-size:12px;color:#666;margin-top:3px;}
.order-actions{display:flex;gap:10px;margin-top:14px;}

.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.7);z-index:1000;display:flex;align-items:center;justify-content:center;padding:20px;}
.modal-box{background:#ffffff;border-radius:14px;border:1px solid #e0e0e0;padding:24px;width:100%;max-width:400px;}
.modal-title{font-weight:700;font-size:17px;margin-bottom:18px;}

.search-bar{width:100%;background:#ffffff;border:1px solid #ccc;border-radius:8px;padding:10px 12px;color:#1a1a1a;font-size:14px;outline:none;margin-bottom:14px;direction:rtl;}
.search-bar:focus{border-color:#a78bfa;}

.tab-group{display:flex;gap:10px;margin-bottom:18px;}
.tab-btn{flex:1;padding:11px;border-radius:10px;border:1px solid #ccc;background:transparent;color:#666;cursor:pointer;font-family:'Heebo';font-weight:700;font-size:14px;}

.header-row{display:flex;align-items:center;gap:12px;margin-bottom:20px;}
.back-btn{background:none;border:none;color:#666;cursor:pointer;font-size:22px;padding:0;line-height:1;}
.screen-title{font-size:21px;font-weight:700;}
.count-pill{margin-right:auto;border-radius:6px;padding:2px 10px;font-size:13px;}
.empty{color:#666;text-align:center;padding:48px 20px;}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
.img-upload-label{display:inline-flex;align-items:center;gap:8px;padding:8px 14px;background:#ffffff;border:1px dashed #ccc;border-radius:8px;cursor:pointer;color:#666;font-size:13px;margin-top:8px;}
.panton-preview{margin-top:10px;max-height:80px;border-radius:8px;border:1px solid #ccc;}
.sync-dot{font-size:12px;color:#666;}

@keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
</style>
</head>
<body>
<div id="app"></div>
<script>
const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzXcf6PrSdLjOMtlAH9GTZMp9v57ir2YDSh1sR4IdlpzfcfySGe_E5D2IDxxH3Pomtm/exec";
const ARCHIVE_URL = "https://script.google.com/macros/s/AKfycbzpN2_wP4W7sHHLGMtKNtlwkUGjz8xNr7nuEfUZRb9BrqqJWyL5WvBHnw_DDNhQen-w/exec";

const STATUS={OPEN:"פתוח",PENDING:"ממתין לאישור לקוח",APPROVED:"מאושר",REJECTED:"נדחה",CANCELLED:"בוטל"};
const RAW_MATERIALS=["PE","PP","PET","PCR","TPE","PMMA","GLASS","ALUMINIUM","OTHER"];
const STORAGE_KEY="colorOrders_v4";
const C={p1:"#a78bfa",p2:"#fb923c",p3:"#34d399",p4:"#60a5fa",danger:"#f87171",success:"#34d399",warn:"#fbbf24"};

let state={screen:"home",orders:[],syncStatus:"idle",modal:null,selectedId:null,archiveTab:"approved",searchQ:"",editOrder:null};

// inputs stored separately to avoid re-render loss
let formData={};

function loadLocal(){try{return JSON.parse(localStorage.getItem(STORAGE_KEY)||"[]");}catch{return[];}}
function saveLocal(o){try{localStorage.setItem(STORAGE_KEY,JSON.stringify(o));}catch{}}

async function sheetsPost(action,payload){
  if(!APPS_SCRIPT_URL)return null;
  try{const res=await fetch(APPS_SCRIPT_URL,{method:"POST",redirect:"follow",headers:{"Content-Type":"text/plain"},body:JSON.stringify({action,...payload})});return await res.json();}
  catch(e){console.error(e);return null;}
}
async function sheetsGet(){
  if(!APPS_SCRIPT_URL)return null;
  try{const res=await fetch(APPS_SCRIPT_URL+"?t="+Date.now(),{redirect:"follow"});return await res.json();}
  catch(e){return null;}
}
async function syncOrder(action,order){
  if(!APPS_SCRIPT_URL)return;
  state.syncStatus="syncing";softRender();
  const res=await sheetsPost(action,{order});
  state.syncStatus=res?.success?"ok":"err";
  softRender();
  setTimeout(()=>{state.syncStatus="idle";softRender();},3000);
}

function generateSerial(){
  const yr=new Date().getFullYear().toString().slice(-2);
  const n=String(state.orders.length+1).padStart(4,"0");
  return `ORD-${yr}-${n}`;
}
function formatDate(iso){
  if(!iso)return"";
  return new Date(iso).toLocaleDateString("he-IL",{day:"2-digit",month:"2-digit",year:"numeric",hour:"2-digit",minute:"2-digit"});
}
function filterOrders(list,q){
  if(!q)return list;
  const lq=q.toLowerCase();
  return list.filter(o=>[
    o.clientName,
    o.distributorName,
    o.productName,
    o.templateNumber,
    o.pantonNumber,
    o.colorDescription,
    formatDate(o.createdAt)
  ].some(v=>v&&v.toLowerCase().includes(lq)));
}
function getOrder(id){return state.orders.find(o=>o.id===id);}
function updateOrder(id,patch){state.orders=state.orders.map(o=>o.id===id?{...o,...patch}:o);saveLocal(state.orders);}


// ── PASSWORD ──────────────────────────────────────────────────
const APP_PASSWORD = "color2026"; // ← שני הסיסמה כאן

function checkAuth(){
  return sessionStorage.getItem("auth") === APP_PASSWORD;
}

function renderLogin(){
  const wrap = el("div",{style:{minHeight:"100vh",display:"flex",alignItems:"center",justifyContent:"center",background:"#f5f5f5"}});
  const box = el("div",{style:{background:"#fff",borderRadius:16,padding:"40px 32px",width:"100%",maxWidth:340,boxShadow:"0 2px 16px rgba(0,0,0,0.08)",textAlign:"center"}});

  box.append(
    el("div",{style:{fontSize:28,fontWeight:700,marginBottom:6}},
      el("span",{style:{color:"#a78bfa"}},"Color"),
      el("span",{}," Orders")
    ),
    el("div",{style:{fontSize:13,color:"#888",marginBottom:28}},"מערכת ניהול הזמנות")
  );

  const inp = el("input",{type:"password",className:"input",placeholder:"הזן סיסמה...",style:{marginBottom:14,fontSize:16,textAlign:"center"}});
  const errMsg = el("div",{style:{color:"#f87171",fontSize:13,marginBottom:10,minHeight:18}});
  const btn = el("button",{className:"btn btn-full",style:{background:"#a78bfa",color:"#fff",fontSize:16}},"כניסה");

  const tryLogin = () => {
    if(inp.value === APP_PASSWORD){
      sessionStorage.setItem("auth", APP_PASSWORD);
      render();
    } else {
      errMsg.textContent = "סיסמה שגויה";
      inp.value = "";
      inp.focus();
    }
  };

  btn.addEventListener("click", tryLogin);
  inp.addEventListener("keydown", e => { if(e.key==="Enter") tryLogin(); });

  box.append(inp, errMsg, btn);
  wrap.appendChild(box);
  return wrap;
}

// ── DOM helpers ──
function el(tag,props,...children){
  const e=document.createElement(tag);
  if(props)Object.entries(props).forEach(([k,v])=>{
    if(k==="style"&&typeof v==="object")Object.assign(e.style,v);
    else if(k.startsWith("on")&&typeof v==="function")e.addEventListener(k.slice(2).toLowerCase(),v);
    else if(k==="className")e.className=v;
    else if(k==="value"&&(tag==="input"||tag==="textarea"))e.value=v;
    else if(k==="checked")e.checked=v;
    else e.setAttribute(k,v);
  });
  children.flat(Infinity).forEach(c=>{
    if(c==null||c===false)return;
    e.appendChild(typeof c==="string"||typeof c==="number"?document.createTextNode(String(c)):c);
  });
  return e;
}

function badge(status){
  const map={[STATUS.OPEN]:C.p1,[STATUS.PENDING]:C.warn,[STATUS.APPROVED]:C.success,[STATUS.REJECTED]:C.danger,[STATUS.CANCELLED]:"#666"};
  const col=map[status]||"#aaa";
  return el("span",{className:"badge",style:{background:col+"25",color:col,border:`1px solid ${col}55`}},status);
}

// soft render — only updates non-input parts (sync dot, badges, lists)
function softRender(){
  const dot=document.getElementById("sync-dot");
  if(dot){
    const map={idle:"",syncing:"⟳ מסנכרן...",ok:"✓ סונכרן",err:"⚠ שגיאה"};
    dot.textContent=map[state.syncStatus]||"";
  }
}

function render(){
  const app=document.getElementById("app");
  app.innerHTML="";
  if(!checkAuth()){app.appendChild(renderLogin());return;}
  app.appendChild(renderScreen());
  if(state.modal)app.appendChild(renderModal());
}

// ── HOME ──
function renderHome(){
  const openCount=state.orders.filter(o=>o.status===STATUS.OPEN).length;
  const pendCount=state.orders.filter(o=>o.status===STATUS.PENDING).length;

  const navBtn=(icon,title,sub,color,screen,badge)=>el("button",{
    className:"nav-btn",
    style:{background:`linear-gradient(135deg,${color}15,${color}05)`,border:`1px solid ${color}44`},
    onClick:()=>{state.screen=screen;state.searchQ="";state.selectedId=null;formData={};render();}
  },
    el("div",{className:"nav-icon",style:{background:color+"25"}},icon),
    el("div",{style:{flex:1}},
      el("div",{style:{fontWeight:700,fontSize:16,color}},title),
      el("div",{style:{fontSize:13,color:"#666",marginTop:2}},sub)
    ),
    badge>0?el("div",{className:"nav-badge",style:{background:color}},badge):null
  );

  return el("div",{style:{minHeight:"100vh",display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",padding:"20px"}},
    el("div",{style:{width:"100%",maxWidth:400}},
      el("div",{style:{textAlign:"center",marginBottom:40}},
        el("div",{style:{fontSize:11,letterSpacing:4,color:"#888",marginBottom:8,textTransform:"uppercase"}},"מערכת ניהול הזמנות"),
        el("div",{style:{fontSize:30,fontWeight:700}},
          el("span",{style:{color:C.p1}},"Color"),
          el("span",{}," Orders")
        ),
        el("div",{style:{fontSize:13,color:"#888",marginTop:6,display:"flex",alignItems:"center",justifyContent:"center",gap:10}},
          el("span",{},state.orders.length+" הזמנות"),
          el("span",{id:"sync-dot",className:"sync-dot"},""),
          APPS_SCRIPT_URL?el("button",{style:{background:"none",border:"1px solid #ccc",borderRadius:6,padding:"2px 10px",color:"#666",cursor:"pointer",fontFamily:"Heebo",fontSize:12},onClick:manualSync},"סנכרן"):null,
          ARCHIVE_URL?el("button",{style:{background:"none",border:"1px solid #a78bfa",borderRadius:6,padding:"2px 10px",color:"#a78bfa",cursor:"pointer",fontFamily:"Heebo",fontSize:12},onClick:async()=>{await syncAllToArchive();}},"סנכרן ארכיון"):null
        )
      ),
      navBtn("📋","פתיחת הזמנה","יצירת הזמנה",C.p1,"new",0),
      navBtn("⚙️","סטטוס ביצוע","עדכון הזמנות פתוחות",C.p2,"execution",openCount),
      navBtn("✅","אישור לקוח","הזמנות ממתינות לאישור",C.p3,"approval",pendCount),
      navBtn("🗄️","ארכיון","הזמנות מאושרות ונדחות",C.p4,"archive",0)
    )
  );
}

// ── NEW ORDER — inputs use live DOM, no re-render on typing ──
function renderNew(){
  return buildNewForm(generateSerial());
}
function buildNewForm(serial,isEdit){
  const liveInput=(key,placeholder)=>{
    const inp=el("input",{className:"input",value:formData[key]||"",placeholder});
    inp.addEventListener("input",e=>{formData[key]=e.target.value;});
    return inp;
  };
  const liveTextarea=(key,placeholder)=>{
    const ta=document.createElement("textarea");
    ta.className="input";ta.placeholder=placeholder;ta.rows=3;ta.textContent=formData[key]||"";
    ta.addEventListener("input",e=>{formData[key]=e.target.value;});
    return ta;
  };
  const toggle=(key,options,color)=>{
    const wrap=el("div",{className:"toggle-group"});
    options.forEach(opt=>{
      const btn=el("button",{className:"toggle-btn"+(formData[key]===opt?" active":"")},opt);
      if(formData[key]===opt){btn.style.borderColor=color;btn.style.background=color+"20";btn.style.color=color;}
      btn.addEventListener("click",()=>{
        formData[key]=opt;
        wrap.querySelectorAll("button").forEach(b=>{
          const isActive=b.textContent===opt;
          b.className="toggle-btn"+(isActive?" active":"");
          b.style.borderColor=isActive?color:"";b.style.background=isActive?color+"20":"";b.style.color=isActive?color:"";
        });
      });
      wrap.appendChild(btn);
    });
    return wrap;
  };
  const multi=(key,options)=>{
    const wrap=el("div",{className:"multi-group",id:"multi-"+key});
    options.forEach(opt=>{
      const arr=formData[key]||[];const sel=arr.includes(opt);
      const btn=el("button",{className:"multi-btn"+(sel?" active":"")},opt);
      if(sel){btn.style.borderColor=C.p1;btn.style.background=C.p1+"20";btn.style.color=C.p1;}
      btn.addEventListener("click",()=>{
        const a=formData[key]||[];const s=a.includes(opt);
        formData[key]=s?a.filter(v=>v!==opt):[...a,opt];
        btn.className="multi-btn"+(!s?" active":"");
        if(!s){btn.style.borderColor=C.p1;btn.style.background=C.p1+"20";btn.style.color=C.p1;}
        else{btn.style.borderColor="";btn.style.background="";btn.style.color="";}
        const otherWrap=document.getElementById("other-material-wrap");
        if(otherWrap)otherWrap.style.display=(formData[key]||[]).includes("OTHER")?"block":"none";
      });
      wrap.appendChild(btn);
    });
    return wrap;
  };

  const f=(label,...content)=>el("div",{className:"field"},el("div",{className:"label"},label),...content);

  const otherWrap=el("div",{id:"other-material-wrap",style:{marginTop:10,display:(formData.rawMaterials||[]).includes("OTHER")?"block":"none"}});
  const otherInp=el("input",{className:"input",value:formData.otherMaterial||"",placeholder:"פרט חומר אחר..."});
  otherInp.addEventListener("input",e=>{formData.otherMaterial=e.target.value;});
  otherWrap.appendChild(otherInp);

  const saveBtn=el("button",{id:"main-save-btn",className:"btn btn-full",style:{background:C.p1,color:"#000",fontSize:16,marginTop:4}},isEdit?"שמור שינויים":"אישור — שמור הזמנה");
  if(!isEdit){
    saveBtn.addEventListener("click",async()=>{
      if(!formData.clientName||!formData.productName)return;
      saveBtn.textContent="שומר...";saveBtn.disabled=true;
      const newOrder={...formData,serial,createdAt:new Date().toISOString(),status:STATUS.OPEN,id:Date.now()};
      state.orders=[...state.orders,newOrder];saveLocal(state.orders);
      await syncOrder("save",newOrder);
      formData={};state.screen="home";render();
    });
  } else {
    saveBtn.setAttribute("data-edit","true");
  }

  // panton image
  const imgWrap=el("div",{});
  const imgLabel=el("label",{className:"img-upload-label"},"📎 הוסף תמונה מהגלריה");
  const imgInput=el("input",{type:"file",accept:"image/*",style:{display:"none"}});
  imgInput.addEventListener("change",e=>{
    const file=e.target.files[0];if(!file)return;
    const r=new FileReader();r.onload=ev=>{formData.pantonImage=ev.target.result;
      const prev=document.getElementById("panton-preview");
      if(prev){prev.src=ev.target.result;prev.style.display="block";}
    };r.readAsDataURL(file);
  });
  imgLabel.appendChild(imgInput);
  const imgPreview=el("img",{id:"panton-preview",className:"panton-preview",style:{display:formData.pantonImage?"block":"none"}});
  if(formData.pantonImage)imgPreview.src=formData.pantonImage;
  imgWrap.append(imgLabel,imgPreview);

  return el("div",{className:"screen"},
    el("div",{className:"header-row"},
      el("button",{className:"back-btn",onClick:()=>{state.screen="home";formData={};render();}},"←"),
      el("div",{className:"screen-title"},"פתיחת הזמנה")
    ),
    el("div",{className:"card"},
      el("div",{className:"grid-2"},
        el("div",{},el("div",{className:"label"},"מספר סידורי"),el("div",{style:{color:C.p1,fontWeight:700,fontSize:16}},serial)),
        el("div",{},el("div",{className:"label"},"תאריך פתיחה"),el("div",{style:{color:"#666",fontSize:14}},formatDate(new Date().toISOString())))
      )
    ),
    el("div",{className:"card"},
      el("div",{className:"card-title",style:{color:C.p1}},"פרטי הזמנה"),
      f("שם משווק",liveInput("distributorName","הקלד שם משווק")),
      f("שם לקוח",liveInput("clientName","הקלד שם לקוח")),
      f("שם פרויקט",liveInput("projectName","הקלד שם פרויקט")),
      f("מספר תבנית",liveInput("templateNumber","הקלד מספר תבנית")),
      f("שם מוצר",liveInput("productName","הקלד שם מוצר")),
      f("מטרת המוצר",liveTextarea("productPurpose","תאר את מטרת המוצר")),
      f("כמות",liveInput("quantity","הקלד כמות...")),
      f("מוצרים משלימים",liveInput("complementaryProducts","למשל: מכסה, משאבה, קולר..."))
    ),
    el("div",{className:"card"},
      el("div",{className:"card-title",style:{color:C.p2}},"צבע"),
      f("תיאור גוון",liveInput("colorDescription","למשל: כחול ים עמוק")),
      f("מספר פנטון",
        liveInput("pantonNumber","למשל: Pantone 285 C"),
        el("div",{style:{marginTop:8}},el("a",{href:"https://www.pantone.com/color-finder",target:"_blank"},"🎨 מצא פנטון באתר Pantone →")),
        el("div",{style:{marginTop:10}},el("div",{className:"label"},"תמונת פנטון"),imgWrap)
      ),
      f("שקיפות",toggle("transparency",["כן","לא"],C.p2)),
      f("האם נדרש צ׳יפ לאישור",toggle("needsChip",["כן","לא"],C.p2)),
      f("האם יש דוגמה להתאמה",toggle("hasSample",["כן","לא"],C.p2))
    ),
    el("div",{className:"card"},
      el("div",{className:"card-title",style:{color:C.p3}},"חומר גלם"),
      multi("rawMaterials",RAW_MATERIALS),
      otherWrap
    ),
    el("div",{className:"card",style:{marginBottom:20}},
      el("div",{className:"card-title",style:{color:C.p4}},"תכונות המוצר"),
      f("הברגה",liveInput("threading","פרט הברגה...")),
      f("גימור פני שטח",toggle("finish",["מבריק","מט","גומי"],C.p4)),
      f("מרקם",toggle("flexibility",["גמיש","קשיח"],C.p4)),
      f("הערות נוספות",liveTextarea("notes","הערות, דגשים מיוחדים..."))
    ),
    saveBtn
  );
}

// ── EXECUTION ──
function renderExecution(){
  const allOrders=state.orders.filter(o=>o.status===STATUS.OPEN);
  const list=filterOrders(allOrders,state.searchQ);
  const wrap=el("div",{className:"screen"});

  const countPill=el("span",{className:"count-pill",style:{background:C.p2+"22",color:C.p2,marginRight:"auto"}},list.length);
  wrap.append(
    el("div",{className:"header-row"},
      el("button",{className:"back-btn",onClick:()=>{state.screen="home";render();}},"←"),
      el("div",{className:"screen-title"},"סטטוס ביצוע"),
      countPill
    )
  );

// ── EDIT ORDER ──
function renderEdit(){
  const o=state.editOrder;
  if(!o){state.screen="home";return renderHome();}

  const wrap=el("div",{className:"screen"});
  wrap.appendChild(
    el("div",{className:"header-row"},
      el("button",{className:"back-btn",onClick:()=>{state.screen="execution";state.editOrder=null;formData={};render();}},"←"),
      el("div",{className:"screen-title"},"עריכת הזמנה"),
      el("div",{style:{fontSize:13,color:"#888",marginRight:"auto"}},o.serial)
    )
  );

  // Build the same form with isEdit=true (save button has no handler yet)
  const form=buildNewForm(o.serial,true);

  // Attach save handler to the edit button
  const saveBtn=form.querySelector("#main-save-btn");
  if(saveBtn){
    saveBtn.addEventListener("click",async()=>{
      if(!formData.clientName||!formData.productName)return;
      saveBtn.textContent="שומר...";saveBtn.disabled=true;
      // merge formData over original order, preserve system fields
      const updated={
        ...o,
        ...formData,
        serial:o.serial,
        createdAt:o.createdAt,
        id:o.id,
        status:o.status
      };
      // Remove ALL orders with this serial first, then add the updated one
      state.orders=state.orders.filter(x=>x.serial!==o.serial);
      state.orders.push(updated);
      saveLocal(state.orders);
      // Deduplicate then sync
      state.orders=deduplicateOrders(state.orders);
      saveLocal(state.orders);
      await syncToArchive(updated);
      if(APPS_SCRIPT_URL){
        state.syncStatus="syncing";softRender();
        const res=await sheetsPost("syncAll",{orders:state.orders});
        state.syncStatus=res?.success?"ok":"err";
        setTimeout(()=>{state.syncStatus="idle";softRender();},3000);
      }
      state.editOrder=null;formData={};state.screen="execution";render();
    });
  }

  wrap.appendChild(form);
  return wrap;
}

function deduplicateOrders(orders){
  // Keep only one order per serial — the one with the latest createdAt
  const map={};
  orders.forEach(o=>{
    const key=o.serial;
    if(!map[key]||o.id>map[key].id) map[key]=o;
  });
  return Object.values(map);
}

function detectFormType(order) {

function generateFormHTML(order, formType) {
  var today = new Date().toLocaleDateString("he-IL", {day:"2-digit",month:"2-digit",year:"numeric"});

  var sampleText = order.hasSample === "\u05db\u05df" ? "<b>\u05db\u05df</b> / \u05dc\u05d0" : "\u05db\u05df / <b>\u05dc\u05d0</b>";
  var sampleQty = isPET ? "2 \u05e7\"\u05d2" : "1 \u05e7\"\u05d2";

    ? "HPP / CPP / RPP / PE / PVC-RIGID / PVC-FLEX / PSCR / HIPS/<br>PMMA SAN / ABS / PC /PA /POM / <u><b>PET</b></u>/ PBT"

function openFormForOrder(order) {
  const formType = detectFormType(order);
  const html = generateFormHTML(order, formType);
  const blob = new Blob([html], {type: 'text/html;charset=utf-8'});
  const url = URL.createObjectURL(blob);
  window.open(url, '_blank');
}


// ── ARCHIVE SHEETS SYNC ───────────────────────────────────────
async function syncToArchive(order) {
  if (!ARCHIVE_URL) return;
  try {
    await fetch(ARCHIVE_URL, {
      method: "POST", redirect: "follow",
      headers: {"Content-Type": "text/plain"},
      body: JSON.stringify({action: "upsert", order})
    });
  } catch(e) { console.error("Archive sync error:", e); }
}

async function syncAllToArchive() {
  if (!ARCHIVE_URL) return;
  try {
    await fetch(ARCHIVE_URL, {
      method: "POST", redirect: "follow",
      headers: {"Content-Type": "text/plain"},
      body: JSON.stringify({action: "syncAll", orders: state.orders})
    });
  } catch(e) { console.error("Archive sync all error:", e); }
}

async function init(){
  const raw=loadLocal();
  state.orders=deduplicateOrders(raw);
  saveLocal(state.orders);
  render();
  if(APPS_SCRIPT_URL){
    state.syncStatus="syncing";softRender();
    const data=await sheetsGet();
    if(data?.orders?.length>0){state.orders=deduplicateOrders(data.orders);saveLocal(state.orders);}
    state.syncStatus="ok";render();
    setTimeout(()=>{state.syncStatus="idle";softRender();},3000);
  }
}
init();
</script>
